; Phantom deployment configuration template.
;
; Every key below maps to a REAL field on an already-existing,
; frozen engine config dataclass -- traced from phantom/*/config.py,
; not invented. Copy this file to phantom.config.ini (same folder as
; deploy.py/start.py) and edit before running deploy.py.
;
; Paths in this file are RELATIVE to this config file's own folder by
; default, so Phantom can be installed anywhere and still find its own
; logs/state (no absolute, install-location-specific path required).
;
; SECRETS: never put a real API key directly in this file if you can
; avoid it. Set the *_api_key_env_var keys to the name of an
; environment variable, set that environment variable on the machine
; (or in your process manager / service definition), and Phantom reads
; the real value from the environment at startup -- never from this
; file, never logged.

[bridge]
; -> phantom.bridge.config.BridgeConfig
; Recommended: set this to the NAME of an environment variable, then
; set that environment variable to your real key. Never commit a real
; key to this file.
api_key_env_var = PHANTOM_BRIDGE_API_KEY
; Local/dev-only fallback if you don't want to use an environment
; variable yet -- logged as a warning if used, not recommended for a
; real deployment.
api_key = REPLACE_WITH_YOUR_BRIDGE_API_KEY
host = 127.0.0.1
port = 8787
allowed_symbols = EURUSD,GBPUSD,USDJPY,USDCHF,AUDUSD,USDCAD,NZDUSD
magic_number = 20260710
max_lot_size = 5.0
max_slippage_points = 20
heartbeat_timeout_seconds = 30.0
command_ttl_seconds = 15.0

[runtime]
; -> phantom.runtime.config.RuntimeConfig
; magic_number MUST match [bridge].magic_number -- both are read by
; the same MT5 EA instance and must agree, or the EA will reject
; commands as a magic-number mismatch.
magic_number = 20260710
max_slippage_points = 20
max_cycle_duration_ms = 250.0
engine_timeout_ms = 100.0
runtime_timeout_ms = 250.0
snapshot_timeout_ms = 50.0
bridge_timeout_ms = 100.0

[trading_profile]
; -> phantom.runtime.profiles -- must be exactly one of the 6 factory
; names below, or "custom" (custom requires you to also edit
; start.py's build_custom_profile() -- not something a config file
; alone can express, since a custom profile also needs an explicit
; allowed_pairs/allowed_strategies list).
;   london_conservative | london_aggressive
;   new_york_conservative | new_york_aggressive
;   london_and_new_york
;   custom
selected_profile = london_conservative

[risk]
; -> phantom.risk_engine.config.RiskEngineConfig (partial -- the
; fields most operators tune; every other field keeps its engine
; default unless you edit start.py's RiskEngineConfig(...) call)
minimum_evidence_score = 65.0
portfolio_heat_limit_r = 6.0
max_concurrent_risk_r = 6.0
daily_risk_limit_r = 3.0
weekly_risk_limit_r = 6.0
monthly_risk_limit_r = 10.0
max_open_positions = 10
max_positions_per_pair = 2

[compliance]
; -> phantom.compliance_engine.config.ComplianceEngineConfig /
; ComplianceRuleProfile (by name -- must be a name registered in
; ComplianceEngineConfig.rule_profiles; "example_generic_profile" is
; the shipped illustrative default, not a real prop-firm's actual
; rules -- replace with your firm's real profile before going live)
rule_profile_name = example_generic_profile

[news]
; -> phantom.market_intelligence.config.MarketIntelligenceConfig
;
; IMPORTANT -- read before editing: the Market Intelligence Engine
; has exactly ONE trust signal for its whole news feed --
; news_feed_trusted below. There is NO per-provider concept anywhere
; in that engine today: no "Trading Economics primary / Forex Factory
; backup" failover, no provider-disagreement detection. This is a
; confirmed fact (grepped -- zero references to either provider name
; anywhere in phantom/market_intelligence/), not an oversight in this
; template. See [news_providers] below and KNOWN_GAPS.md.
;
; What DOES exist and IS fail-closed today: if you cannot vouch for
; your news feed, set news_feed_trusted = false and the engine
; assumes the worst (blackout, score=0) rather than silently treating
; an untrustworthy feed as safe.
news_feed_trusted = true
pre_news_blackout_minutes = 30.0
post_news_blackout_minutes = 15.0
high_impact_requires_blackout = true
central_bank_requires_blackout = true

[news_providers]
; RESERVED for phantom/news_ingestion/ (ADR-033 Part 2), which does
; NOT exist in this repository yet -- these keys are parsed and
; validated so the config format is ready, but nothing currently reads
; or acts on them. Trading Economics is the intended primary provider,
; Forex Factory the automatic backup, per ADR-033's design -- once
; that package is built. Until then, [news].news_feed_trusted above is
; the only real, working news-trust control.
trading_economics_api_key_env_var = PHANTOM_TRADING_ECONOMICS_API_KEY
trading_economics_base_url = https://api.tradingeconomics.com
forex_factory_base_url =

[reliability]
; -> phantom.reliability.config.ReliabilityConfig
heartbeat_healthy_interval_seconds = 5.0
heartbeat_degraded_interval_seconds = 15.0
heartbeat_grace_period_seconds = 30.0
snapshot_freshness_threshold_seconds = 5.0
cpu_degraded_threshold_pct = 70.0
cpu_critical_threshold_pct = 90.0
memory_degraded_threshold_pct = 75.0
memory_critical_threshold_pct = 90.0
queue_degraded_depth = 100
queue_critical_depth = 500

[logging]
; Consumed by start.py itself (not an engine config field -- the
; engines all log through Python's stdlib `logging` module and do not
; know about file paths themselves; start.py attaches the handlers
; described here before constructing any engine). Relative paths
; (the default) are resolved against this config file's own folder.
log_dir = logs
log_level = INFO
state_dir = state
